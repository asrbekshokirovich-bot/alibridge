# ============================================
# ALI BRIDGE — Docker Compose (Development)
# ============================================

services:
  # ============================================
  # PostgreSQL 16
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: alibridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alibridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-alibridge}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alibridge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alibridge-network

  # ============================================
  # Redis 7
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: alibridge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alibridge-network

  # ============================================
  # Backend (FastAPI + aiogram)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: alibridge-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - alibridge-network

  # ============================================
  # Background Worker (arq)
  # ============================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: alibridge-worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.main.WorkerSettings
    networks:
      - alibridge-network

  # ============================================
  # Frontend (React Mini App, production nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: alibridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - alibridge-network

  # ============================================
  # Cloudflare Tunnel (Mini App public HTTPS URL)
  # Ephemeral (trycloudflare.com) yoki Named tunnel
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: alibridge-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://frontend:80
    depends_on:
      - frontend
    networks:
      - alibridge-network

  # ============================================
  # MinIO (S3-compatible storage, dev only)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: alibridge-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - alibridge-network

# ============================================
# Networks
# ============================================
networks:
  alibridge-network:
    driver: bridge
    name: alibridge-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    name: alibridge-postgres-data
  redis_data:
    name: alibridge-redis-data
  minio_data:
    name: alibridge-minio-data
  backend_logs:
    name: alibridge-backend-logs
