name: CI — ALI BRIDGE

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─── Backend: lint + format + type check ────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff + mypy
        run: pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check app/

      - name: Format check (ruff format)
        run: ruff format --check app/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true # Gradual typing adoption

  # ─── Frontend: type check + build ───────────────────────────────────────────
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.com

  # ─── Deploy: Render'ga avtomatik deploy (faqat main, CI o'tgach) ─────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render frontend deploy
        if: ${{ env.RENDER_FRONTEND_HOOK != '' }}
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_HOOK }}
        run: curl -fsSL -X POST "$RENDER_FRONTEND_HOOK"

      - name: Trigger Render backend deploy
        if: ${{ env.RENDER_BACKEND_HOOK != '' }}
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_HOOK }}
        run: curl -fsSL -X POST "$RENDER_BACKEND_HOOK"
