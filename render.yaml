services:
  # ============================================
  # Backend — FastAPI + aiogram bot
  # ============================================
  - type: web
    name: alibridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: alibridgebot
      # Bot polling rejimida ishlaydi (Render web service doimo yoniq).
      # Cloudflared/tunnel kerak emas — Render public HTTPS beradi.
      - key: BOT_FORCE_POLLING
        value: "true"
      - key: MINIAPP_URL
        value: https://alibridge-frontend.onrender.com
      # Barkod PDF yorliq linklari uchun — backend o'z URL'i (PDF backend'da generatsiya bo'ladi)
      - key: PUBLIC_BASE_URL
        value: https://alibridge-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://alibridge-frontend.onrender.com,https://web.telegram.org,https://t.me
      - key: DATABASE_URL
        sync: false
      - key: DB_USE_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: alibridge-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: QR_HMAC_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: POSTGRES_USER
        value: postgres.wiqjhquaojlrtgnkpcdi
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        value: aws-1-eu-central-1.pooler.supabase.com
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: postgres
      - key: PYTHON_VERSION
        value: "3.12.0"
      # ── Supabase Storage (rasm yuklash) ──
      # Maxfiy kalitlar (ACCESS/SECRET) Render dashboard'da qo'lda kiritiladi (sync:false)
      - key: S3_ENDPOINT
        value: https://wiqjhquaojlrtgnkpcdi.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: eu-central-1
      - key: S3_BUCKET
        value: product-images
      - key: S3_USE_SSL
        value: "true"
      - key: S3_PUBLIC_URL
        value: https://wiqjhquaojlrtgnkpcdi.storage.supabase.co/storage/v1/object/public/product-images
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
    healthCheckPath: /health

  # ============================================
  # Redis (Key Value)
  # ============================================
  - type: redis
    name: alibridge-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ============================================
  # Frontend — React/Vite (Static Site)
  # ============================================
  - type: web
    name: alibridge-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    # SPA — barcha yo'llar index.html ga
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # index.html HECH QACHON keshlanmaydi — Telegram/CDN har doim yangi JS hash oladi.
    # Hashlangan assetlar (immutable) esa uzoq keshlanadi.
    headers:
      - path: /index.html
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
      - path: /
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    envVars:
      # Vite 8 / TypeScript 6 Node 20+ talab qiladi (default eski Node build'ni buzadi)
      - key: NODE_VERSION
        value: "22.11.0"
      - key: VITE_BOT_USERNAME
        value: alibridgebot
      - key: VITE_APP_VERSION
        value: "1.0.0"
      - key: VITE_API_URL
        value: https://alibridge-backend.onrender.com/api/v1
