name: CI — ALI BRIDGE

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─── Backend: lint + type check + tests ─────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ali_bridge_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check app/ tests/

      - name: Format check (ruff format)
        run: poetry run ruff format --check app/ tests/

      - name: Type check (mypy)
        run: poetry run mypy app/ --ignore-missing-imports
        continue-on-error: true  # Gradual typing adoption

      - name: Unit tests
        run: poetry run pytest tests/unit/ -v --tb=short
        env:
          TESTING: "true"

      - name: Scenario tests
        run: poetry run pytest tests/scenarios/ -v --tb=short
        env:
          TESTING: "true"

      - name: Integration tests (with DB)
        run: poetry run pytest tests/integration/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/ali_bridge_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
          BOT_TOKEN: "fake:token_for_testing"
          JWT_SECRET: "test-jwt-secret-32-bytes-minimum!"
          QR_HMAC_SECRET: "test-qr-hmac-secret-32-bytes-min!"
          ENCRYPTION_KEY: "dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5"

      - name: Test coverage
        run: poetry run pytest tests/ --cov=app --cov-report=xml --cov-fail-under=60
        env:
          TESTING: "true"
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        if: always()

  # ─── Frontend: type check + build ───────────────────────────────────────────
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.com

      - name: Check bundle size
        run: |
          ls -lh dist/assets/*.js | head -5
          du -sh dist/

  # ─── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          tags: ali-bridge-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: false
          tags: ali-bridge-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
