version: "3.9"

# Production Docker Compose konfiguratsiyasi.
# Farqlari dev'dan:
# - No volume mounts (images must contain code)
# - Resource limits set
# - restart: always
# - Frontend served via Nginx (no Vite dev server)
# - MinIO replaced by real S3 in env vars

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ─── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ali_bridge
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ali_bridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY}/ali-bridge-backend:${VERSION:-latest}
    build:
      context: ./backend
      target: production
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/ali_bridge
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BOT_TOKEN: ${BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_credentials
      WEBHOOK_URL: https://${DOMAIN}/api/v1/telegram/webhook
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    secrets:
      - google_credentials
    logging: *default-logging
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first

  # ─── Worker (arq) ───────────────────────────────────────────────────────────
  worker:
    image: ${REGISTRY}/ali-bridge-backend:${VERSION:-latest}
    command: python -m arq app.workers.main.WorkerSettings
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/ali_bridge
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BOT_TOKEN: ${BOT_TOKEN}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Nginx + Frontend ───────────────────────────────────────────────────────
  nginx:
    image: ${REGISTRY}/ali-bridge-frontend:${VERSION:-latest}
    build:
      context: ./frontend
      target: production
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Certbot (SSL auto-renewal) ───────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    restart: always
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  letsencrypt:
  certbot_webroot:

secrets:
  google_credentials:
    file: ./secrets/google_credentials.json
