server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rasm yuklash uchun (passport/bilet — telefon rasmlari 2-5MB).
    # Backend 5MB gacha qabul qiladi; nginx undan oshmasligi uchun 8MB qo'yamiz.
    client_max_body_size 8m;

    # Docker internal DNS resolver — backend IP o'zgarganda qayta resolve qiladi
    resolver 127.0.0.11 valid=30s ipv6=off;

    # API proxy → backend container
    # $request_uri ishlatilsa nginx URI ni o'zgartirmaydi
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Maxfiy fayllar — OCHIQ KIRISH RAD ETILADI (C2) ───────────────────────
    # passport / ticket / selfie / evidence rasmlari faqat backend'ning
    # auth'li `/api/v1/uploads/file` endpoint orqali beriladi (admin + token).
    # Regex location prefix location'dan ustun — shuning uchun bu birinchi tekshiriladi.
    location ~ ^/media/[^/]+/(passport|passports|ticket|tickets|selfie|evidence)(/|$) {
        return 403;
    }

    # MinIO proxy — faqat MAXFIY BO'LMAGAN rasmlar (katalog/intake) uchun
    # Fayl URL: /media/alibridge-uploads/intake/2026-05/uuid.jpg
    #
    # MUHIM: bu REGEX location (`~ ^/media/`), oddiy prefix EMAS. Sababi: pastdagi
    # statik-asset regex (`\.(jpg|png|...)$`) `/media/.../x.jpg` ni ushlab olib,
    # faylni diskdan qidirib 404 berardi (nginx'da regex location prefix'dan ustun).
    # Regex sifatida va passport-block regexidan KEYIN, statik-regexdan OLDIN
    # joylashgani uchun: passport→403, intake→MinIO proxy, haqiqiy asset→disk.
    location ~ ^/media/ {
        set $minio http://minio:9000;
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass         $minio;
        proxy_http_version 1.1;
        proxy_set_header   Host              minio:9000;
        proxy_buffering    off;
        proxy_read_timeout 30s;

        # Rasmlarni brauzer cache qiladi (1 kun)
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    # index.html — hech qachon cache qilinmasin (chunk hash o'zgaradi har buildda)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # SPA fallback — barcha route'lar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Static assets — 1 yil cache (content hash bilan)
    location ~* \.(?:css|js|woff2?|svg|jpg|jpeg|png|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers (MED-7) — to'liq CSP (L1).
    # script-src 'unsafe-inline' YO'Q → inline <script> injection bloklanadi (XSS himoyasi).
    # telegram.org — Telegram Web App SDK; blob/wasm — html5-qrcode skaner fallback.
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' https://telegram.org 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'self' https://web.telegram.org https://t.me; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options   "nosniff"                                                       always;
    add_header X-XSS-Protection         "1; mode=block"                                                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"                               always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()"                      always;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
