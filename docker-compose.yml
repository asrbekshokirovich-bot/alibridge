# ============================================
# ALI BRIDGE — Docker Compose (Development)
# ============================================

services:
  # ============================================
  # PostgreSQL 16
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: alibridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alibridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-alibridge}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Port yopildi — faqat Docker internal tarmoq orqali kirish mumkin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alibridge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alibridge-network

  # ============================================
  # Redis 7
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: alibridge-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Port yopildi — faqat Docker internal tarmoq orqali kirish mumkin
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alibridge-network

  # ============================================
  # Backend (FastAPI + aiogram)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: alibridge-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - cf_shared:/cf_shared:ro    # cloudflared tunnel URL'ni o'qish uchun (read-only)
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - alibridge-network

  # ============================================
  # Background Worker (arq)
  # ============================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: alibridge-worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: arq app.workers.main.WorkerSettings
    networks:
      - alibridge-network

  # ============================================
  # Frontend (React Mini App, production nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: alibridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - alibridge-network

  # ============================================
  # Cloudflare Tunnel (Mini App public HTTPS URL)
  # Ephemeral (trycloudflare.com) yoki Named tunnel
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: alibridge-cloudflared
    restart: unless-stopped
    user: root   # log fayliga yozish uchun
    # --logfile: log shared volume'ga yoziladi, backend URL'ni avto-topish uchun o'qiydi
    command: >
      --logfile /cf_shared/tunnel.log
      tunnel --no-autoupdate --protocol http2
      --url http://frontend:80
    volumes:
      - cf_shared:/cf_shared
    depends_on:
      - frontend
    networks:
      - alibridge-network

  # ============================================
  # MinIO (S3-compatible storage, dev only)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: alibridge-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - alibridge-network

# ============================================
# Networks
# ============================================
networks:
  alibridge-network:
    driver: bridge
    name: alibridge-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    name: alibridge-postgres-data
  redis_data:
    name: alibridge-redis-data
  minio_data:
    name: alibridge-minio-data
  backend_logs:
    name: alibridge-backend-logs
  cf_shared:
    name: alibridge-cf-shared
