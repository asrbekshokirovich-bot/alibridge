server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver — backend IP o'zgarganda qayta resolve qiladi
    resolver 127.0.0.11 valid=30s ipv6=off;

    # API proxy → backend container
    # $request_uri ishlatilsa nginx URI ni o'zgartirmaydi
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback — barcha route'lar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — 1 yil cache (content hash bilan)
    location ~* \.(?:css|js|woff2?|svg|jpg|jpeg|png|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Telegram WebApp headers
    # ALLOWALL o'chirildi — faqat Telegram domenlariga ruxsat
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://t.me" always;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
