# ============================================
# ALI BRIDGE — Docker Compose (Development)
# DB: Supabase (bulut) — lokal postgres ishlatilmaydi.
# ============================================

services:
  # ============================================
  # Redis 7
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: alibridge-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alibridge-network

  # ============================================
  # Backend (FastAPI + aiogram) — Supabase'ga ulanadi
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: alibridge-backend
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - cf_shared:/cf_shared:ro
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - alibridge-network

  # ============================================
  # Frontend (React Mini App, production nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: alibridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - alibridge-network

  # ============================================
  # Cloudflare Tunnel (Mini App public HTTPS URL)
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: alibridge-cloudflared
    restart: unless-stopped
    user: root
    # QUIC protokol + ko'p ulanish (HA) — http2'dan barqarorroq.
    # Uzilsa cloudflared o'zi qayta ulanadi; backend watchdog yangi URL'ni
    # avtomatik aniqlab bot menu'ni yangilaydi.
    command: >
      --logfile /cf_shared/tunnel.log
      tunnel --no-autoupdate --protocol quic
      --retries 10 --grace-period 30s
      --url http://frontend:80
    volumes:
      - cf_shared:/cf_shared
    depends_on:
      - frontend
    networks:
      - alibridge-network

# ============================================
# Networks
# ============================================
networks:
  alibridge-network:
    driver: bridge
    name: alibridge-network

# ============================================
# Volumes
# ============================================
volumes:
  redis_data:
    name: alibridge-redis-data
  backend_logs:
    name: alibridge-backend-logs
  cf_shared:
    name: alibridge-cf-shared
