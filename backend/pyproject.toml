[tool.poetry]
name = "alibridge-backend"
version = "1.0.0"
description = "ALI BRIDGE — Telegram Bot + Mini App backend"
authors = ["ALI BRIDGE Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = "^0.0.12"

# Telegram bot
aiogram = "^3.13.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.13.3"

# Validation
pydantic = "^2.9.2"
pydantic-settings = "^2.6.0"

# Cache & queues
redis = "^5.2.0"
arq = "^0.26.3"

# Security
pyjwt = "^2.9.0"
cryptography = "^43.0.3"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

# Storage (S3)
boto3 = "^1.35.55"
aioboto3 = "^13.2.0"

# OCR
passporteye = "^2.2.2"
google-cloud-vision = "^3.8.0"

# Labels (PDF)
reportlab = "^4.2.5"
qrcode = {extras = ["pil"], version = "^8.0"}
python-barcode = "^0.15.1"
Pillow = "^11.0.0"

# HTTP client
httpx = "^0.27.2"

# Utilities
python-dateutil = "^2.9.0"
pytz = "^2024.2"
babel = "^2.16.0"
phonenumbers = "^8.13.48"

# Logging
structlog = "^24.4.0"

# Monitoring
sentry-sdk = {extras = ["fastapi"], version = "^2.18.0"}

# Internationalization
fluent-runtime = "^0.4.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.2"
faker = "^30.8.1"

# Linting / formatting
ruff = "^0.7.2"
mypy = "^1.13.0"
black = "^24.10.0"

# Type stubs
types-pytz = "^2024.2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# ============================================
# Tool configs
# ============================================

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (formatter handles it)
    "B008",  # function calls in default args (FastAPI Depends)
    "S101",  # assert (tests use it)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Unit tests (fast, no dependencies)",
    "integration: Integration tests (DB, Redis)",
    "scenario: End-to-end scenario tests",
    "slow: Slow tests (>1s)",
]


[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
